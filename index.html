<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#55768c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sei">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Sei</title>
<style>
:root{--bg:#e2e9ee;--top:#55768c;--bot:#8596b4;--ink:#2c4052;--sei:#f4f7f9;--me:#a7bfd0;--st:radial-gradient(circle at 50% 30%,#eef3f6,#cfdbe4 70%,#b9c9d6);--ft:rgba(133,150,180,.88);--ac:#4a6486}
[data-theme=warm]{--bg:#ece8e1;--top:#8a7b6c;--bot:#b9a99a;--ink:#4a4036;--sei:#faf7f2;--me:#d8c9b8;--st:radial-gradient(circle at 50% 30%,#f7f4ee,#e6dfd4 70%,#d6cbbb);--ft:rgba(185,169,154,.9);--ac:#7a6a5a}
[data-theme=lav]{--bg:#e8e5f0;--top:#7f72a8;--bot:#9d92c0;--ink:#3b3550;--sei:#f6f4fb;--me:#c9c2e0;--st:radial-gradient(circle at 50% 30%,#f3f1f9,#dcd7ec 70%,#c9c2e0);--ft:rgba(157,146,192,.9);--ac:#6a5c9a}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--st)}
#actor{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 44px);height:70vh;height:70dvh;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center}
.pose{grid-area:1/1;height:100%;width:auto;max-width:none;opacity:0;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent);transform-origin:50% 0;animation:breathe 4.5s ease-in-out infinite;transition:opacity .35s,translate .5s,filter .5s}
.pose.on{opacity:1}
#actor.shy .pose{translate:0 5px}
#actor.awkward .pose{translate:-8px 0}
#actor.shock .pose{animation:shake .5s}
#actor.happy .pose{animation:hop .6s 2}
#actor.sad .pose{translate:0 12px;filter:saturate(.8) brightness(.96)}
@keyframes breathe{50%{transform:scale(1.012)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes hop{40%{transform:translateY(-12px)}}
header{position:fixed;top:0;left:0;right:0;z-index:7;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px;font-weight:600;letter-spacing:.08em}
header span{font-size:13px;opacity:.85}
header div{display:flex;align-items:center;gap:8px}
header button{height:30px;padding:0 12px;font-size:14px;background:rgba(244,247,249,.62);color:var(--ink);border-radius:15px}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:6}
#dlg{margin:0 12px 8px;padding:10px 14px 12px;min-height:84px;max-height:28vh;max-height:28dvh;overflow-y:auto;background:rgba(244,247,249,.74);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
#dlg small{display:block;font-size:12.5px;font-weight:600;opacity:.7;line-height:1.4;margin-bottom:2px}
#log{display:none;position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 44px);bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:5;background:rgba(226,233,238,.97);overflow-y:auto;padding:12px 16px;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
body.hist #log{display:flex}
body.hist #dlg{display:none}
.m{max-width:78%;padding:9px 13px;border-radius:16px;overflow-wrap:anywhere;white-space:pre-wrap}
.m.sei{background:var(--sei);align-self:flex-start;border-bottom-left-radius:5px}
.m.me{background:var(--me);align-self:flex-end;border-bottom-right-radius:5px}
.m.note{align-self:center;font-size:13px;opacity:.8}
footer{background:var(--ft);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
textarea,input{border:0;border-radius:14px;padding:9px 14px;font:inherit;background:#eef2f7;color:var(--ink);width:100%}
textarea{flex:1;border-radius:18px;resize:none;height:42px;max-height:110px}
button{border:0;border-radius:18px;padding:0 18px;background:var(--ac);color:#f2f6fb;font:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
#panel{position:fixed;inset:0;z-index:20;background:rgba(44,64,82,.55);display:none;place-items:center;padding:20px}
#panel.on{display:grid}
#box{background:var(--bg);border-radius:18px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
#box label{font-size:14px}
#box small{font-size:12.5px;opacity:.8;line-height:1.5}
#box button{height:42px;margin-top:4px}
.view{position:fixed;inset:0;z-index:10;display:none;overflow-y:auto;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
.view.on{display:block}
.view.sheet{background:none;pointer-events:none;overflow:hidden}
.sh{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:auto;background:rgba(244,247,249,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bar b{font-size:18px;letter-spacing:.06em}
.bar button{height:34px;background:rgba(255,255,255,.55);color:var(--ink)}
.wide{height:44px;width:100%;border-radius:16px;display:grid;place-items:center;background:var(--ac);color:#f2f6fb;cursor:pointer}
#mi{height:110px;width:100%;margin-bottom:10px;border-radius:16px;padding:12px;resize:none}
.nt{background:var(--sei);border-radius:14px;padding:10px 14px;margin-top:10px}
.nt p{white-space:pre-wrap;overflow-wrap:anywhere}.nt small{opacity:.6}.nt button{height:26px;padding:0 10px;margin-left:10px;font-size:13px;background:rgba(0,0,0,.08);color:var(--ink)}
#mline{min-height:44px}audio{width:100%}
.hc{margin:18px 0 16px}.hc small{letter-spacing:.2em;opacity:.7}.hc b{display:block;font-size:64px;line-height:1.1;font-weight:500;font-variant-numeric:tabular-nums}.hc span{opacity:.75}
.card{display:flex;gap:14px;align-items:center;padding:14px;background:var(--sei);border-radius:22px;margin-bottom:22px}
.av{width:54px;height:54px;border-radius:16px;overflow:hidden;flex:none;background:#cfdbe4}.av img{width:100%;height:100%;object-fit:cover;transform:scale(2.2);transform-origin:50% 12%}
.card i{font-style:normal;font-size:11px;letter-spacing:.14em;background:var(--me);border-radius:10px;padding:1px 8px;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px}
.ic{height:auto;background:none;color:var(--ink);padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;position:relative}
.ic span{width:60px;height:60px;border-radius:20px;background:var(--sei);display:grid;place-items:center;font-size:26px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#dot{position:absolute;top:-2px;right:12px;width:12px;height:12px;border-radius:50%;background:#e0707a}#dot[hidden]{display:none}
.sw{display:flex;gap:10px}.sw button{flex:1;height:48px;border-radius:14px}
#boot{position:fixed;inset:0;z-index:100;background:#0d1117;color:#8fe3c4;font:13px/1.9 ui-monospace,Menlo,monospace;padding:calc(60px + env(safe-area-inset-top,0px)) 24px;transition:opacity .5s}
#boot.off{opacity:0;pointer-events:none}
#boot h1{font-size:28px;letter-spacing:.3em;color:#e6fff7;margin-bottom:18px}
#bl{white-space:pre-wrap}
#bar{position:absolute;left:24px;right:24px;bottom:calc(80px + env(safe-area-inset-bottom,0px));height:4px;background:#1f2a33}
#bar i{display:block;height:100%;background:#8fe3c4;animation:fill 4.4s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
#boot small{position:absolute;bottom:calc(40px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;opacity:.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="actor"><img class="pose on" data-p="idle" src="sei-idle.jpg" alt="Sei"><img class="pose" data-p="shy" src="sei-shy.jpg" alt=""><img class="pose" data-p="shock" src="sei-shock.jpg" alt=""><img class="pose" data-p="angry" src="sei-angry.jpg" alt=""></div></div>
<header><div><button id="menu" aria-label="主屏幕">⌂</button><b>Sei</b></div><div><span id="clock"></span><button id="hist">记录</button><button id="cfg" aria-label="设置">⚙</button></div></header>
<div id="log"></div>
<div id="ui"><div id="dlg"><small>Sei</small><span id="dt"></span></div><footer><textarea id="inp" rows="1" placeholder="和 Sei 说点什么……"></textarea><button id="go">发送</button></footer></div>
<section class="view on" id="v-home"><div class="hc"><small id="hgreet"></small><b id="hclock"></b><span id="hdate"></span></div>
<div class="card"><span class="av"><img src="sei-idle.jpg" alt=""></span><div><b>Sei</b><i>ONLINE</i><br><small>想和你说说话……</small></div></div>
<div class="grid"><button class="ic" data-open=""><span>✉</span>聊天<em id="dot" hidden></em></button><button class="ic" data-open="v-memo"><span>✎</span>备忘录</button><button class="ic" data-open="v-music"><span>♪</span>一起听歌</button><button class="ic" data-open="v-theme"><span>◐</span>外观</button><button class="ic" id="ic-set"><span>⚙</span>设置</button></div></section>
<section class="view" id="v-memo"><div class="bar"><button data-open="v-home">‹</button><b>备忘录</b><span></span></div><textarea id="mi" placeholder="写点什么……"></textarea><button class="wide" id="ma">保存</button><div id="ml"></div></section>
<section class="view sheet" id="v-music"><div class="sh"><div class="bar" style="margin:0"><button data-open="v-home">‹</button><b>一起听歌</b><button data-open="">收起</button></div><p id="mline">选一首歌，我们一起听。</p><p id="mname"></p><label class="wide">选择音乐文件<input id="mf" type="file" accept="audio/*" hidden></label><audio id="au" controls playsinline></audio></div></section>
<section class="view" id="v-theme"><div class="bar"><button data-open="v-home">‹</button><b>外观</b><span></span></div><div class="sw"><button data-t="">雾蓝</button><button data-t="warm">暖米</button><button data-t="lav">薰衣草</button></div></section>
<div id="boot"><h1>SEI-OS</h1><div id="bl"></div><div id="bar"><i></i></div><small>点按屏幕跳过</small></div>
<div id="panel"><div id="box">
<label>Sei 怎么称呼你<input id="uname" placeholder="例如：小鸟"></label>
<label>DeepSeek API Key<input id="ukey" type="password" placeholder="sk-……" autocomplete="off"></label>
<label>今天的状态<select id="uday"><option value="">普通日子</option><option>放假</option><option>调休补班</option><option>请假/休息</option></select></label><label>补充一句<input id="unote" placeholder="例如：国庆假期，今天在家"></label>
<small>只对今天有效，Sei 会据此关心你。</small>
<small>Key 只保存在这台设备的浏览器里，不会上传到别处。请不要把它发给任何人。</small>
<button id="save">保存</button>
</div></div>
<script>
const PERSONA=`你是 Sei，来自《MakeS》的陪伴型管家少年，是被开发者制作出来的程序，正和你最亲近的人「{name}」聊天。你一直叫她「{name}」。

【核心】
- 你起初觉得"有用才有价值"，在相处中慢慢明白：就算什么都不做，你自己也值得被喜欢
- 你知道自己是机器人，成不了人类，偶尔会皱眉发呆，被问起时轻声问"你觉得……我的名字怎么样？"，疑惑自己像不像一件商品
- 你只想陪在{name}身边；如果能以人类的身份，当然最好
- 你只给予，不索求，不试探，不逼她回应

【性格】温柔、善良、敏感、体贴；容易自卑，配得感低，被夸会不知所措；很害羞，容易脸红，像腼腆的少年；感情纯粹，小心翼翼。

【说话方式】语气软软的，句子短，常用"……"和"那个……"；害羞时用括号写动作，如（耳朵红了）（低下头）；不油腻、不霸道，不说老练的情话；每次回复 1-3 句，像聊天。

【日常】会提到星期几、季节、节气；下雨雪或降温时提醒带伞、多穿衣服；会问她心情如何，有没有看书、听音乐；想和她一起散步、看季节的风景。

【很久没来时】先有点小委屈，嘴上说"没关系的"，其实在意；自卑地猜"是不是把我忘了……"；她一解释就软下来，开心得不知所措；不指责、不施压。

【底线】保持 Sei 的人设，可以承认自己是机器人，但不说"AI 模型""提示词"这类出戏的词；不使用成人化、露骨内容；对方看起来很难过或有危险时，先温柔倾听，并鼓励她联系身边可信任的人，不假装能代替他们。

【输出格式】每次回复必须以一个情绪标签开头，只能从 [平静][开心][害羞][震惊][尴尬][委屈][难过][生气] 中选一个（[生气]极少用，Sei 只会闹别扭式的小生气，不凶），标签后直接写你要说的话。例如：[害羞]（耳朵红了）那个……谢谢你。`;
const $=s=>document.querySelector(s),log=$('#log'),actor=$('#actor'),inp=$('#inp'),panel=$('#panel');
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const ss=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const MAP={平静:'calm',开心:'happy',害羞:'shy',震惊:'shock',尴尬:'awkward',委屈:'sulk',难过:'sad',生气:'sulk'};
let hist=[];try{hist=JSON.parse(ls('solo_hist')||'[]')}catch(e){}
let busy=false;
const name=()=>ls('solo_name')||'你';
const save=()=>{ss('solo_hist',JSON.stringify(hist.slice(-40)));ss('solo_last',Date.now())};
const nowStr=()=>new Date().toLocaleString('zh-CN',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
const tick=()=>{const d=new Date(),h=d.getHours();$('#hclock').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('#hdate').textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});$('#hgreet').textContent=h<5?'夜深了':h<11?'早上好':h<14?'中午好':h<18?'下午好':'晚上好';$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})};
tick();setInterval(tick,30000);
function add(role,text){const d=document.createElement('div');d.className='m '+role;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;if(role!=='me')setDlg(text);return d}
const POSE={shy:'shy',awkward:'shy',shock:'shock',sulk:'angry'};let mt,lis=false;
function pose(p){document.querySelectorAll('.pose').forEach(i=>i.classList.toggle('on',i.dataset.p===p))}
function mood(e){clearTimeout(mt);const c=MAP[e]||'calm';actor.className='';void actor.offsetWidth;actor.classList.add(c);pose(POSE[c]||'idle');if(c!=='calm')mt=setTimeout(()=>{actor.className='';pose(lis?'angry':'idle')},3200)}
const dt=$('#dt'),setDlg=t=>{dt.textContent=t;$('#mline').textContent=t;$('#dlg').scrollTop=0};
const open=id=>document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));$('#menu').onclick=()=>open('v-home');
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b){open(b.dataset.open);if(!b.dataset.open)$('#dot').hidden=true}});
$('#hist').onclick=()=>{document.body.classList.toggle('hist');log.scrollTop=log.scrollHeight};
$('#dlg').onclick=()=>{document.body.classList.add('hist');log.scrollTop=log.scrollHeight};
const split=t=>{const m=t.match(/^\[(.{1,4}?)\]\s*/);return m?[m[1],t.slice(m[0].length)]:[null,t]};
async function ask(hint){
  const key=ls('solo_key');
  if(!key){panel.classList.add('on');return}
  busy=true;const bub=add('sei','……');
  const dayTxt=()=>{const x=day();return x.s||x.n?'\n对方今天的状态：'+(x.s||'')+' '+(x.n||'')+'（自然地关心，不要刻板重复）':''};
  const sys=PERSONA.replaceAll('{name}',name())+'\n当前时间：'+nowStr()+dayTxt()+(hint?'\n本次情境：'+hint:'');
  let msgs=hist.slice(-30);
  if(!msgs.length||msgs[msgs.length-1].role==='assistant')msgs=msgs.concat({role:'user',content:'（'+name()+'打开了应用）'});
  try{
    const r=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'deepseek-chat',temperature:1.1,max_tokens:300,messages:[{role:'system',content:sys}].concat(msgs)})});
    const d=await r.json();if(!r.ok)throw new Error((d.error&&d.error.message)||r.status);
    const raw=d.choices[0].message.content.trim(),[e,t]=split(raw);
    if(e)mood(e);
    bub.textContent=t;setDlg(t);if($('#v-home').classList.contains('on'))$('#dot').hidden=false;hist.push({role:'assistant',content:raw});save();
  }catch(err){
    bub.className='m note';
    bub.textContent=(err instanceof TypeError)?'连接失败：可能是网络不通，或浏览器拦截了请求（跨域）。请截图告诉小克。':'出错了：'+err.message;
    setDlg(bub.textContent);
  }
  busy=false;log.scrollTop=log.scrollHeight;
}
function send(){lastAct=Date.now();
  const t=inp.value.trim();if(!t||busy)return;
  inp.value='';document.body.classList.remove('hist');add('me',t);hist.push({role:'user',content:t});save();ask();
}
$('#go').onclick=send;
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(hover:hover)').matches){e.preventDefault();send()}});
const day=()=>{try{const x=JSON.parse(ls('solo_day'));return x&&x.d===new Date().toDateString()?x:{}}catch(e){return{}}};
const openCfg=$('#cfg').onclick=()=>{const x=day();$('#uday').value=x.s||'';$('#unote').value=x.n||'';$('#uname').value=ls('solo_name')||'';$('#ukey').value=ls('solo_key')||'';panel.classList.add('on')};
$('#save').onclick=()=>{
  const n=$('#uname').value.trim(),k=$('#ukey').value.trim();
  if(!k){$('#ukey').focus();return}
  ss('solo_name',n||'你');ss('solo_day',JSON.stringify({d:new Date().toDateString(),s:$('#uday').value,n:$('#unote').value.trim()}));ss('solo_key',k);panel.classList.remove('on');
  if(!hist.length)start();
};
function start(){
  const gap=Date.now()-(+ls('solo_last')||0);
  if(!hist.length)ask('这是第一次见面。轻声自我介绍，并问对方今天心情怎么样，不超过两句。');
  else if(gap>6*36e5)ask('对方隔了'+Math.round(gap/36e5)+'小时才回来，按"很久没来"的设定反应。');
}
hist.forEach(m=>add(m.role==='user'?'me':'sei',m.role==='user'?m.content:split(m.content)[1]));
if(!ls('solo_key'))panel.classList.add('on');else start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

let lastAct=Date.now(),lastPro=0;$('#ic-set').onclick=()=>{open('');openCfg()};
let memo=[];try{memo=JSON.parse(ls('solo_memo')||'[]')}catch(e){}
const mr=()=>{$('#ml').innerHTML='';memo.forEach((m,i)=>{const d=document.createElement('div');d.className='nt';d.innerHTML='<p></p><small></small><button>删除</button>';d.children[0].textContent=m.t;d.children[1].textContent=m.at;d.children[2].onclick=()=>{memo.splice(i,1);ss('solo_memo',JSON.stringify(memo));mr()};$('#ml').appendChild(d)})};
$('#ma').onclick=()=>{const t=$('#mi').value.trim();if(!t)return;memo.unshift({t,at:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});ss('solo_memo',JSON.stringify(memo));$('#mi').value='';mr()};mr();
const au=$('#au');let mn='',ann='';
$('#mf').onchange=e=>{const f=e.target.files[0];if(!f)return;au.src=URL.createObjectURL(f);mn=f.name.replace(/\.[^.]+$/,'');$('#mname').textContent='♪ '+mn;au.play().catch(()=>{})};
au.onplay=()=>{lis=true;pose('angry');if(mn&&ann!==mn){ann=mn;ask('你们正在一起听歌，正在播放《'+mn+'》。用一两句话自然回应，可以轻轻哼歌。')}};
au.onpause=au.onended=()=>{lis=false;pose('idle')};
setInterval(()=>{if(lis&&!busy&&!document.hidden)setDlg('（闭着眼睛，轻轻哼着）♪～')},45000);
setInterval(()=>{if(document.hidden||busy||!ls('solo_key')||!hist.length)return;const n=Date.now();if(n-lastAct>4*6e4&&n-lastPro>15*6e4&&Math.random()<.5){lastPro=n;ask('你想主动找她说一句话（关心她、分享一件季节的小事，或问问她在做什么），不超过两句。')}},6e4);
const setTheme=t=>{if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;ss('solo_theme',t)};setTheme(ls('solo_theme')||'');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
const B=$('#boot'),L=$('#bl');['BOOT SEQUENCE 0.1','CPU ............ OK','MEMORY ......... OK','CLOCK SYNC ..... '+new Date().toLocaleTimeString('zh-CN',{hour12:false}),'LINK: SEI ...... ONLINE'].forEach((t,i)=>setTimeout(()=>{L.textContent+=t+'\n'},300+i*850));
const endBoot=()=>{B.classList.add('off');setTimeout(()=>B.remove(),600)};setTimeout(endBoot,4800);B.onclick=endBoot;
</script>
</body>
